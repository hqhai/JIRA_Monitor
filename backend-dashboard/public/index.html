<!doctype html>
<html lang="vi" data-theme="dark">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#282a36">
 <title>FSLP Backend Dashboard</title>
 <link rel="icon" href="/icons/icon-32.png">
 <link rel="stylesheet" href="/fonts/fonts.css">
 <link rel="stylesheet" href="/style.css">
</head>
<body>
 <aside class="sidebar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 18V8M10 18v-6M15 18V5M20 18v-4"/></svg></span><span>FSLP Backend</span></div>
  <nav class="source-list" aria-label="Màn hình">
   <span class="nav-indicator" aria-hidden="true"></span>
   <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Tổng quan</span></a>
   <a href="#progress" data-view="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4"/><path d="M4 5h11l-2 3.5 2 3.5H4"/><path d="M18 20v-5M14 20v-2"/></svg><span>Tiến độ</span></a>
   <a href="#analytics" data-view="analytics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/></svg><span>Phân tích</span></a>
   <a href="#workload" data-view="workload"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.7-3.4 3.2-5 6-5s5.3 1.6 6 5"/><path d="M16 11.5a3 3 0 1 0 0-6M18 15c1.6.6 2.7 2.2 3 5"/></svg><span>Workload</span></a>
   <a href="#tasks" data-view="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6h11M9.5 12h11M9.5 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg><span>Task</span></a>
  </nav>
  <div class="side-section">
   <div class="side-title">Thành viên</div>
   <div id="member-list" class="member-list"></div>
  </div>
  <div class="side-foot"><span class="live-dot" id="live-dot"></span><span>Jira: chỉ ghi khi bạn xác nhận</span></div>
 </aside>
 <div class="workspace">
  <header class="toolbar" id="toolbar">
   <div class="toolbar-title" id="sprint-slot"></div>
   <div class="toolbar-actions">
    <span id="connection">Đang tải…</span>
    <button id="theme-toggle" class="icon-button" aria-label="Chuyển giao diện" aria-pressed="false"></button>
    <button id="refresh" class="button primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 13a8 8 0 0 0 14.6 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/></svg><span>Đồng bộ Jira</span></button>
   </div>
  </header>
  <div id="notice" role="status" class="notice hidden"></div>
  <div id="scope-bar" class="scope-bar"></div>
  <main id="main" tabindex="-1"></main>
 </div>
 <dialog id="detail"><div id="detail-content"></div></dialog>
 <div id="tip" class="tip hidden" role="tooltip"></div>
 <div id="toast" class="toast hidden" role="status"></div>
 <script type="module" src="/app.js"></script>
</body>
</html>
